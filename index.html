<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yardage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF1F0;
  --card:#FFFFFF;
  --ink:#0F1A20;
  --muted:#657780;
  --edge:#D3DAD8;
  --flag:#B32E24;
  --turf:#24594A;
  
  --shadow:rgba(15,26,32,.08);
  color-scheme:light;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1317;
    --card:#141F25;
    --ink:#EAF0EE;
    --muted:#8699A2;
    --edge:#243139;
    --flag:#E2584C;
    --turf:#5FA88F;
    --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1317;--card:#141F25;--ink:#EAF0EE;--muted:#8699A2;
  --edge:#243139;--flag:#E2584C;--turf:#5FA88F;--shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--turf);outline-offset:2px;border-radius:4px}

.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}

/* ---- top bar ---- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px 12px;border-bottom:1px solid var(--edge);
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;
}
.bar h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.bar .sub{font-size:13px;color:var(--muted);font-weight:400}
.gps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--turf)}
.dot.weak{background:#C98A1E}
.dot.off{background:var(--flag)}

/* ---- scroll body ---- */
.body{flex:1;overflow-y:auto;padding:0 18px 24px}

/* ---- setup screens ---- */
.lede{margin:26px 0 6px;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
.note{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5;max-width:52ch}
.pick{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;width:100%;
  text-align:left;padding:15px 16px;margin-bottom:9px;background:var(--card);
  border:1px solid var(--edge);border-radius:11px;box-shadow:0 1px 2px var(--shadow);
}
.pick:active{transform:translateY(1px)}
.pick .nm{font-size:17px;font-weight:600}
.pick .mt{font-size:13px;color:var(--muted);white-space:nowrap}
.pick.on{border-color:var(--turf);box-shadow:inset 0 0 0 1px var(--turf)}
.go{
  width:100%;padding:17px;margin-top:18px;border-radius:11px;
  background:var(--turf);color:#fff;font-size:17px;font-weight:600;
}
.go[disabled]{opacity:.4}
.back{font-size:14px;color:var(--muted);padding:6px 0;margin-top:18px}

/* ---- hole screen ---- */
.holehead{display:flex;align-items:baseline;gap:14px;padding:20px 2px 4px}
.holenum{font-size:30px;font-weight:700;letter-spacing:-.02em}
.holemeta{font-size:14px;color:var(--muted)}

.yard{text-align:center;padding:6px 0 4px}
.center{
  font-size:clamp(86px,30vw,148px);font-weight:700;line-height:.86;
  letter-spacing:-.045em;color:var(--flag);
}
.center.stale{opacity:.35}
.centerlab{font-size:13px;color:var(--muted);margin-top:8px}
.fb{display:flex;justify-content:center;gap:34px;margin-top:16px}
.fb div{text-align:center}
.fb .v{font-size:30px;font-weight:600;letter-spacing:-.02em}
.fb .l{font-size:12px;color:var(--muted);margin-top:2px}
.nogps{color:var(--muted);font-size:14px;line-height:1.5;text-align:center;padding:26px 10px;max-width:40ch;margin:0 auto}

/* ---- strokes ---- */
.strokes{
  display:flex;align-items:center;justify-content:center;gap:22px;
  margin:22px 0 6px;padding:16px 0;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);
}
.step{
  width:66px;height:66px;border-radius:50%;border:1px solid var(--edge);
  background:var(--card);font-size:30px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px var(--shadow);
}
.step:active{background:var(--paper)}
.count{min-width:96px;text-align:center}
.count .n{font-size:60px;font-weight:700;line-height:1;letter-spacing:-.03em}
.count .l{font-size:12px;color:var(--muted);margin-top:4px}

/* ---- footer nav ---- */
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--edge);background:var(--paper);
}
.nav button{padding:11px 15px;border-radius:9px;border:1px solid var(--edge);background:var(--card);font-size:15px;font-weight:500}
.nav button[disabled]{opacity:.35}
.total{text-align:center;line-height:1.2}
.total .v{font-size:19px;font-weight:700;letter-spacing:-.01em}
.total .l{font-size:12px;color:var(--muted)}

/* ---- scorecard ---- */
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--edge)}
th{font-weight:500;color:var(--muted);font-size:12px}
td.h{text-align:left;font-weight:500}
tr.sum td{font-weight:700;border-bottom:none;padding-top:11px}
.under{color:var(--turf)}
.over{color:var(--flag)}
.issue{
  background:var(--card);border:1px solid var(--edge);border-left:3px solid #C98A1E;
  border-radius:9px;padding:12px 14px;margin:16px 0;font-size:13px;color:var(--muted);line-height:1.5
}
</style>
</head>

/* ------------------------------------------------------------------ state */
const LS = 'yardage.v1';
let S = { view:'home', courseId:null, loopIds:[], teeId:null, idx:0, round:null, rounds:[] };
let pos = null, posAge = 0, watchId = null, gpsState = 'off';

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const d = JSON.parse(raw); S.rounds = d.rounds || []; S.round = d.active || null; }
  }catch(e){ /* storage unavailable or corrupt; start clean */ }
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({ rounds:S.rounds, active:S.round })); }
  catch(e){ /* nothing we can do; the round stays in memory */ }
}

/* -------------------------------------------------------------- geometry */
const R = 6371000, YD = 1.09361;
const rad = d => d*Math.PI/180;
function dist(a, b){
  const p1 = rad(a[1]), p2 = rad(b[1]);
  const dp = p2-p1, dl = rad(b[0]-a[0]);
  const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*YD;
}
function greenDistances(ring, me){
  let near = Infinity, far = 0, cx = 0, cy = 0;
  for(const p of ring){
    const d = dist(me, p);
    if(d < near) near = d;
    if(d > far) far = d;
    cx += p[0]; cy += p[1];
  }
  const mid = dist(me, [cx/ring.length, cy/ring.length]);
  return { front:Math.round(near), center:Math.round(mid), back:Math.round(far) };
}

/* ------------------------------------------------------------------- gps */
function startGPS(){
  if(watchId !== null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(
    p => {
      pos = [p.coords.longitude, p.coords.latitude];
      posAge = Date.now();
      gpsState = p.coords.accuracy <= 12 ? 'good' : 'weak';
      render();
    },
    () => { gpsState = 'off'; render(); },
    { enableHighAccuracy:true, maximumAge:2000, timeout:20000 }
  );
}
function stopGPS(){ if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; } }

/* ------------------------------------------------------------- round helpers */
function course(){ return COURSES[S.round ? S.round.courseId : S.courseId]; }
function playedHoles(r){
  const c = COURSES[r.courseId];
  const out = [];
  for(const lid of r.loopIds){
    const L = c.loops.find(x => x.id === lid);
    for(const h of L.holes) out.push({ loopId:lid, loopName:L.name, hole:h });
  }
  return out;
}
function parOf(h, teeId){ return h.par[teeId] ?? Object.values(h.par)[0]; }
function ydOf(h, teeId){ return h.yd[teeId] ?? Object.values(h.yd)[0]; }
function toPar(r){
  const hs = playedHoles(r);
  let s = 0, p = 0;
  r.scores.forEach((v, i) => { if(v > 0){ s += v; p += parOf(hs[i].hole, r.teeId); } });
  return { strokes:s, par:p, rel:s-p };
}
const relText = n => n === 0 ? 'Even' : (n > 0 ? '+'+n : String(n));

/* ------------------------------------------------------------------ views */
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const v = S.round ? 'play' : S.view;
  ({ home:viewHome, loops:viewLoops, tees:viewTees, play:viewPlay, card:viewCard, history:viewHistory }[v] || viewHome)(app);
}

function bar(title, sub, showGps){
  const g = { good:['dot good','GPS ready'], weak:['dot weak','GPS weak'], off:['dot off','No GPS'] }[gpsState] || ['dot','Finding GPS'];
  return `<div class="bar">
    <div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    ${showGps ? `<div class="gps"><span class="${g[0]}"></span>${g[1]}</div>` : ''}
  </div>`;
}

/* --- home --- */
function viewHome(app){
  stopGPS();
  app.appendChild(el(bar('Yardage', 'Four courses, no subscription', false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">Where are you playing?</p>
    <p class="note">Pick a course to start a round. Distances come from your phone's GPS to the green.</p>`;
  for(const id in COURSES){
    const c = COURSES[id];
    const btn = el(`<button class="pick"><span class="nm">${c.name.replace(/ (Golf Club|Golf Course|State Park Golf Course|Club)$/,'')}</span><span class="mt">${c.city.split(',')[0]}</span></button>`);
    btn.onclick = () => {
      S.courseId = id;
      S.teeId = c.defaultTeeSet;
      S.loopIds = c.defaultLoops || c.loops.map(l => l.id);
      S.view = c.loops.length > 1 ? 'loops' : 'tees';
      render();
    };
    b.appendChild(btn);
  }
  if(S.rounds.length){
    const h = el('<button class="back">See past rounds</button>');
    h.onclick = () => { S.view = 'history'; render(); };
    b.appendChild(h);
  }
  app.appendChild(b);
}

/* --- loop picker (McCabe) --- */
function viewLoops(app){
  const c = COURSES[S.courseId];
  app.appendChild(el(bar(c.name, 'Choose two nines', false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">Which nines?</p>
    <p class="note">${c.name} has three. Pick the two you're playing, in order.</p>`;
  const pairs = [];
  for(let i = 0; i < c.loops.length; i++)
    for(let j = 0; j < c.loops.length; j++)
      if(i !== j) pairs.push([c.loops[i], c.loops[j]]);
  const seen = new Set();
  for(const [a, d] of pairs){
    const key = a.id + '+' + d.id;
    if(seen.has(key)) continue;
    seen.add(key);
    const rt = c.ratings.find(r => r.teeSetId === S.teeId && r.loopIds.length === 2 &&
      r.loopIds.includes(a.id) && r.loopIds.includes(d.id));
    const btn = el(`<button class="pick"><span class="nm">${a.name} then ${d.name}</span><span class="mt">${rt ? rt.rating + ' / ' + rt.slope : ''}</span></button>`);
    btn.onclick = () => { S.loopIds = [a.id, d.id]; S.view = 'tees'; render(); };
    b.appendChild(btn);
  }
  const back = el('<button class="back">Back to courses</button>');
  back.onclick = () => { S.view = 'home'; render(); };
  b.appendChild(back);
  app.appendChild(b);
}

/* --- tee picker --- */
function viewTees(app){
  const c = COURSES[S.courseId];
  app.appendChild(el(bar(c.name, 'Choose your tees', false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">Which tees?</p><p class="note">Yardages and par follow the tee you pick.</p>`;
  const holes = () => {
    const out = [];
    for(const lid of S.loopIds) out.push(...c.loops.find(l => l.id === lid).holes);
    return out;
  };
  for(const t of c.teeSets){
    const hs = holes();
    const total = hs.reduce((n, h) => n + (h.yd[t.id] ?? 0), 0);
    const par = hs.reduce((n, h) => n + (h.par[t.id] ?? 0), 0);
    const rt = c.ratings.find(r => r.teeSetId === t.id &&
      (r.loopIds.length === 1 || S.loopIds.every(x => r.loopIds.includes(x))));
    const btn = el(`<button class="pick${t.id === S.teeId ? ' on' : ''}">
      <span class="nm">${t.name}</span>
      <span class="mt">${total.toLocaleString()} yds · par ${par}${rt ? ' · ' + rt.rating + '/' + rt.slope : ''}</span></button>`);
    btn.onclick = () => { S.teeId = t.id; render(); };
    b.appendChild(btn);
  }
  const go = el('<button class="go">Start round</button>');
  go.onclick = () => {
    const n = S.loopIds.reduce((m, lid) => m + c.loops.find(l => l.id === lid).holes.length, 0);
    S.round = { id:String(Date.now()), courseId:S.courseId, loopIds:S.loopIds.slice(), teeId:S.teeId,
                date:new Date().toISOString(), scores:new Array(n).fill(0), idx:0 };
    save(); render();
  };
  b.appendChild(go);
  const back = el('<button class="back">Back</button>');
  back.onclick = () => { S.view = c.loops.length > 1 ? 'loops' : 'home'; render(); };
  b.appendChild(back);
  app.appendChild(b);
}

/* --- playing --- */
function viewPlay(app){
  startGPS();
  const r = S.round, c = COURSES[r.courseId];
  const hs = playedHoles(r);
  const i = Math.min(r.idx, hs.length - 1);
  const { hole, loopName } = hs[i];
  const tee = c.teeSets.find(t => t.id === r.teeId);
  const multi = r.loopIds.length > 1;

  app.appendChild(el(bar(c.name.replace(/ (Golf Club|Golf Course|State Park Golf Course|Club)$/,''),
    `${tee.name} tees${multi ? ' · ' + loopName : ''}`, true)));

  const b = el('<div class="body"></div>');
  const par = parOf(hole, r.teeId), yd = ydOf(hole, r.teeId);
  b.appendChild(el(`<div class="holehead">
      <span class="holenum">Hole ${hole.n}</span>
      <span class="holemeta">Par ${par} · ${yd} yds${hole.si ? ' · SI ' + hole.si : ''}</span>
    </div>`));

  if(pos){
    const d = greenDistances(hole.g, pos);
    const stale = Date.now() - posAge > 15000;
    b.appendChild(el(`<div class="yard">
        <div class="center${stale ? ' stale' : ''}">${d.center}</div>
        <div class="centerlab">to the middle of the green</div>
        <div class="fb">
          <div><div class="v">${d.front}</div><div class="l">front</div></div>
          <div><div class="v">${d.back}</div><div class="l">back</div></div>
        </div>
      </div>`));
  } else {
    b.appendChild(el(`<div class="nogps">${
      gpsState === 'off'
        ? 'Location is off or blocked. Turn it on for this site in your browser settings, then reopen this page. You can still keep score.'
        : 'Finding your position. This takes a few seconds outdoors, longer under trees.'
    }</div>`));
  }

  const sc = r.scores[i];
  const strokes = el(`<div class="strokes">
      <button class="step" aria-label="One fewer stroke">−</button>
      <div class="count"><div class="n">${sc || '—'}</div><div class="l">strokes</div></div>
      <button class="step" aria-label="One more stroke">+</button>
    </div>`);
  const [minus, plus] = strokes.querySelectorAll('.step');
  minus.onclick = () => { r.scores[i] = Math.max(0, (r.scores[i] || 0) - 1); save(); render(); };
  plus.onclick = () => { r.scores[i] = (r.scores[i] || 0) + 1; save(); render(); };
  b.appendChild(strokes);

  const finish = el('<button class="back">Finish round</button>');
  finish.onclick = () => { S.view = 'card'; render(); };
  b.appendChild(finish);
  app.appendChild(b);

  const t = toPar(r);
  const nav = el(`<div class="nav">
      <button ${i === 0 ? 'disabled' : ''}>‹ Hole ${Math.max(1, hs[i-1]?.hole.n ?? 1)}</button>
      <div class="total"><div class="v">${t.strokes ? relText(t.rel) : '—'}</div><div class="l">thru ${r.scores.filter(x => x > 0).length}</div></div>
      <button ${i >= hs.length - 1 ? 'disabled' : ''}>Hole ${hs[i+1]?.hole.n ?? ''} ›</button>
    </div>`);
  const [prev, next] = nav.querySelectorAll('button');
  prev.onclick = () => { r.idx = i - 1; save(); render(); };
  next.onclick = () => { r.idx = i + 1; save(); render(); };
  app.appendChild(nav);
}

/* --- scorecard --- */
function viewCard(app){
  stopGPS();
  const r = S.round || S.viewRound;
  const c = COURSES[r.courseId];
  const hs = playedHoles(r);
  const t = toPar(r);
  app.appendChild(el(bar(c.name, new Date(r.date).toLocaleDateString(), false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">${t.strokes || '—'} <span style="font-size:19px;font-weight:500;color:var(--muted)">${t.strokes ? relText(t.rel) : 'no scores yet'}</span></p>`;

  let rows = '';
  hs.forEach((x, i) => {
    const p = parOf(x.hole, r.teeId), s = r.scores[i];
    const cls = !s ? '' : (s < p ? 'under' : (s > p ? 'over' : ''));
    rows += `<tr><td class="h">${r.loopIds.length > 1 ? x.loopName.slice(0,1) + ' ' : ''}${x.hole.n}</td>
      <td>${p}</td><td>${ydOf(x.hole, r.teeId)}</td><td class="${cls}">${s || '·'}</td></tr>`;
  });
  b.appendChild(el(`<table><thead><tr><th style="text-align:left">Hole</th><th>Par</th><th>Yds</th><th>Score</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr class="sum"><td class="h">Total</td><td>${t.par || '—'}</td><td></td><td>${t.strokes || '—'}</td></tr></tfoot></table>`));

  if(S.round){
    const done = el('<button class="go">Save round</button>');
    done.onclick = () => {
      S.rounds.unshift({ ...r, saved:new Date().toISOString() });
      S.round = null; S.view = 'home'; save(); render();
    };
    b.appendChild(done);
    const resume = el('<button class="back">Keep playing</button>');
    resume.onclick = () => { S.view = 'play'; render(); };
    b.appendChild(resume);
  } else {
    const back = el('<button class="back">Back</button>');
    back.onclick = () => { S.viewRound = null; S.view = 'history'; render(); };
    b.appendChild(back);
  }
  app.appendChild(b);
}

/* --- history --- */
function viewHistory(app){
  app.appendChild(el(bar('Past rounds', '', false)));
  const b = el('<div class="body"></div>');
  if(!S.rounds.length){
    b.innerHTML = `<p class="lede">Nothing saved yet</p><p class="note">Finish a round and it'll show up here.</p>`;
  } else {
    b.innerHTML = `<p class="lede">Past rounds</p>`;
    S.rounds.forEach(r => {
      const c = COURSES[r.courseId], t = toPar(r);
      const btn = el(`<button class="pick"><span class="nm">${c.name.replace(/ (Golf Club|Golf Course|State Park Golf Course|Club)$/,'')}</span>
        <span class="mt">${t.strokes} · ${relText(t.rel)} · ${new Date(r.date).toLocaleDateString()}</span></button>`);
      btn.onclick = () => { S.viewRound = r; S.view = 'card'; render(); };
      b.appendChild(btn);
    });
  }
  const back = el('<button class="back">Back</button>');
  back.onclick = () => { S.view = 'home'; render(); };
  b.appendChild(back);
  app.appendChild(b);
}

/* ------------------------------------------------------------------- boot */
load();
render();
</script>
</body>
</html>
