<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yardage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#EEF1F0;
  --card:#FFFFFF;
  --ink:#0F1A20;
  --muted:#657780;
  --edge:#D3DAD8;
  --flag:#B32E24;
  --turf:#24594A;
  --rough:#DCE4DC;
  --fairway:#C2D6BC;
  --greenc:#A8C9A4;
  --bunker:#E8DFC6;
  --water:#B7CBDA;
  
  --shadow:rgba(15,26,32,.08);
  color-scheme:light;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1317;
    --card:#141F25;
    --ink:#EAF0EE;
    --muted:#8699A2;
    --edge:#243139;
    --flag:#E2584C;
    --turf:#5FA88F;
    --rough:#1B262B;
    --fairway:#263A33;
    --greenc:#335445;
    --bunker:#3B3728;
    --water:#1F3240;
    --shadow:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1317;--card:#141F25;--ink:#EAF0EE;--muted:#8699A2;
  --edge:#243139;--flag:#E2584C;--turf:#5FA88F;--shadow:rgba(0,0,0,.4);
  --rough:#1B262B;--fairway:#263A33;--greenc:#335445;--bunker:#3B3728;--water:#1F3240;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--turf);outline-offset:2px;border-radius:4px}

.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}

/* ---- top bar ---- */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px 12px;border-bottom:1px solid var(--edge);
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;
}
.bar h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.bar .sub{font-size:13px;color:var(--muted);font-weight:400}
.gps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--turf)}
.dot.weak{background:#C98A1E}
.dot.off{background:var(--flag)}

/* ---- scroll body ---- */
.body{flex:1;overflow-y:auto;padding:0 18px 24px}

/* ---- setup screens ---- */
.lede{margin:26px 0 6px;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
.note{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5;max-width:52ch}
.pick{
  display:flex;align-items:baseline;justify-content:space-between;gap:14px;width:100%;
  text-align:left;padding:15px 16px;margin-bottom:9px;background:var(--card);
  border:1px solid var(--edge);border-radius:11px;box-shadow:0 1px 2px var(--shadow);
}
.pick:active{transform:translateY(1px)}
.pick .nm{font-size:17px;font-weight:600}
.pick .mt{font-size:13px;color:var(--muted);white-space:nowrap}
.pick.on{border-color:var(--turf);box-shadow:inset 0 0 0 1px var(--turf)}
.go{
  width:100%;padding:17px;margin-top:18px;border-radius:11px;
  background:var(--turf);color:#fff;font-size:17px;font-weight:600;
}
.go[disabled]{opacity:.4}
.back{font-size:14px;color:var(--muted);padding:6px 0;margin-top:18px}

/* ---- hole screen ---- */
.holehead{display:flex;align-items:baseline;gap:14px;padding:20px 2px 4px}
.holenum{font-size:30px;font-weight:700;letter-spacing:-.02em}
.holemeta{font-size:14px;color:var(--muted)}

.yard{text-align:center;padding:6px 0 4px}
.center{
  font-size:clamp(86px,30vw,148px);font-weight:700;line-height:.86;
  letter-spacing:-.045em;color:var(--flag);
}
.center.stale{opacity:.35}
.centerlab{font-size:13px;color:var(--muted);margin-top:8px}
.fb{display:flex;justify-content:center;gap:34px;margin-top:16px}
.fb div{text-align:center}
.fb .v{font-size:30px;font-weight:600;letter-spacing:-.02em}
.fb .l{font-size:12px;color:var(--muted);margin-top:2px}
.nogps{color:var(--muted);font-size:14px;line-height:1.5;text-align:center;padding:26px 10px;max-width:40ch;margin:0 auto}

/* ---- strokes ---- */
.strokes{
  display:flex;align-items:center;justify-content:center;gap:22px;
  margin:22px 0 6px;padding:16px 0;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);
}
.step{
  width:66px;height:66px;border-radius:50%;border:1px solid var(--edge);
  background:var(--card);font-size:30px;font-weight:500;line-height:1;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px var(--shadow);
}
.step:active{background:var(--paper)}
.count{min-width:96px;text-align:center}
.count .n{font-size:60px;font-weight:700;line-height:1;letter-spacing:-.03em}
.count .l{font-size:12px;color:var(--muted);margin-top:4px}

/* ---- footer nav ---- */
.nav{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--edge);background:var(--paper);
}
.nav button{padding:11px 15px;border-radius:9px;border:1px solid var(--edge);background:var(--card);font-size:15px;font-weight:500}
.nav button[disabled]{opacity:.35}
.total{text-align:center;line-height:1.2}
.total .v{font-size:19px;font-weight:700;letter-spacing:-.01em}
.total .l{font-size:12px;color:var(--muted)}

/* ---- scorecard ---- */
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:14px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--edge)}
th{font-weight:500;color:var(--muted);font-size:12px}
td.h{text-align:left;font-weight:500}
tr.sum td{font-weight:700;border-bottom:none;padding-top:11px}
.under{color:var(--turf)}
.over{color:var(--flag)}
.toggle{display:flex;gap:6px;margin:10px 0 2px}
.toggle button{
  flex:1;padding:9px;border:1px solid var(--edge);border-radius:9px;background:var(--card);
  font-size:14px;font-weight:500;color:var(--muted);
}
.toggle button.on{color:var(--ink);border-color:var(--turf);box-shadow:inset 0 0 0 1px var(--turf)}
.mapwrap{margin:12px 0 4px;display:flex;justify-content:center}
.holemap{width:100%;max-height:46vh;height:auto;display:block}
.maprow{margin-top:10px;gap:28px}
.shots{margin:14px 0 2px;text-align:center}
.logshot{
  width:100%;padding:16px;border-radius:11px;background:var(--ink);color:var(--paper);
  font-size:17px;font-weight:600;
}
.logshot[disabled]{opacity:.32}
.shothint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.shotlist{list-style:none;margin:14px 0 0;padding:0;font-size:14px}
.shotlist li{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--edge)}
.sq{width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.sy{font-weight:600;min-width:62px}
.sl{color:var(--muted)}
.putts{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--edge)}
.putts .pl{font-size:14px;color:var(--muted)}
.putts .pv{font-size:24px;font-weight:600;min-width:34px;text-align:center}
.pstep{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:var(--card);font-size:20px;line-height:1}
.exports{margin-top:18px}
.dump{width:100%;margin-top:10px;font:12px/1.45 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--edge);border-radius:9px;background:var(--card);color:var(--ink)}
.barright{display:flex;align-items:center;gap:12px;flex:none}
.endbtn{
  padding:8px 13px;border:1px solid var(--edge);border-radius:8px;background:var(--card);
  font-size:14px;font-weight:500;box-shadow:0 1px 2px var(--shadow);white-space:nowrap;
}
.endbtn:active{background:var(--paper)}
.savepart{justify-content:center;font-size:16px;font-weight:600;margin-top:4px}
.danger{color:var(--flag)}
.issue{
  background:var(--card);border:1px solid var(--edge);border-left:3px solid #C98A1E;
  border-radius:9px;padding:12px 14px;margin:16px 0;font-size:13px;color:var(--muted);line-height:1.5
}
</style>
</head>

/* ------------------------------------------------------------------ state */
const LS = 'yardage.v1';
let S = { view:'home', mode:'num', courseId:null, loopIds:[], teeId:null, idx:0, round:null, rounds:[] };
let pos = null, posAcc = 99, posAge = 0, watchId = null, gpsState = 'off';

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const d = JSON.parse(raw); S.rounds = d.rounds || []; S.round = d.active || null; }
  }catch(e){ /* storage unavailable or corrupt; start clean */ }
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({ rounds:S.rounds, active:S.round })); }
  catch(e){ /* nothing we can do; the round stays in memory */ }
}

/* -------------------------------------------------------------- geometry */
const R = 6371000, YD = 1.09361;
const rad = d => d*Math.PI/180;
function dist(a, b){
  const p1 = rad(a[1]), p2 = rad(b[1]);
  const dp = p2-p1, dl = rad(b[0]-a[0]);
  const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(h))*YD;
}
function greenDistances(ring, me){
  let near = Infinity, far = 0, cx = 0, cy = 0;
  for(const p of ring){
    const d = dist(me, p);
    if(d < near) near = d;
    if(d > far) far = d;
    cx += p[0]; cy += p[1];
  }
  const mid = dist(me, [cx/ring.length, cy/ring.length]);
  return { front:Math.round(near), center:Math.round(mid), back:Math.round(far) };
}

/* ------------------------------------------------------------------- map */
/**
 * Project lon/lat to local metres, then rotate so the tee-to-green line runs
 * straight up the screen. Golfers read a hole from where they stand toward the
 * flag, so north-up would be the wrong orientation on most holes.
 */
function holeView(h, me, shots){
  const all = [];
  const push = r => { for(const p of r) all.push(p); };
  push(h.g); h.fw.forEach(push); h.bk.forEach(push); h.hz.forEach(z => push(z.r)); push(h.cl);

  const lat0 = all.reduce((n, p) => n + p[1], 0) / all.length;
  const mPerLat = 111320, mPerLon = 111320 * Math.cos(rad(lat0));
  const lon0 = all.reduce((n, p) => n + p[0], 0) / all.length;
  const toM = p => [(p[0] - lon0) * mPerLon, (p[1] - lat0) * mPerLat];

  const tee = toM(h.cl[0]);
  const gc = toM(h.g.reduce((a, p) => [a[0] + p[0] / h.g.length, a[1] + p[1] / h.g.length], [0, 0]));
  const ang = Math.atan2(gc[0] - tee[0], gc[1] - tee[1]); // bearing tee -> green
  const cs = Math.cos(-ang), sn = Math.sin(-ang);
  const rot = ([x, y]) => [x * cs - y * sn, -(x * sn + y * cs)]; // y flipped: screen down is +

  const prj = p => rot(toM(p));
  const pts = all.map(prj);
  if(me) pts.push(prj(me));
  if(shots) for(const sh of shots) pts.push(prj(sh.p));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = 14;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;

  const path = r => 'M' + r.map(p => { const q = prj(p); return (q[0] - minX).toFixed(1) + ' ' + (q[1] - minY).toFixed(1); }).join('L') + 'Z';
  const line = r => 'M' + r.map(p => { const q = prj(p); return (q[0] - minX).toFixed(1) + ' ' + (q[1] - minY).toFixed(1); }).join('L');
  const pt = p => { const q = prj(p); return [q[0] - minX, q[1] - minY]; };

  return { w:maxX - minX, h:maxY - minY, path, line, pt };
}

function mapSvg(h, me, shots){
  const v = holeView(h, me, shots);
  const parts = [];
  parts.push(`<rect x="0" y="0" width="${v.w}" height="${v.h}" fill="var(--rough)" rx="10"/>`);
  for(const f of h.fw) parts.push(`<path d="${v.path(f)}" fill="var(--fairway)"/>`);
  for(const z of h.hz) parts.push(`<path d="${v.path(z.r)}" fill="var(--water)"/>`);
  for(const bk of h.bk) parts.push(`<path d="${v.path(bk)}" fill="var(--bunker)"/>`);
  parts.push(`<path d="${v.line(h.cl)}" fill="none" stroke="var(--ink)" stroke-opacity=".18" stroke-width="1.2" stroke-dasharray="4 5"/>`);
  parts.push(`<path d="${v.path(h.g)}" fill="var(--greenc)" stroke="var(--ink)" stroke-opacity=".18" stroke-width="1"/>`);

  const gc = h.g.reduce((a, p) => [a[0] + p[0] / h.g.length, a[1] + p[1] / h.g.length], [0, 0]);
  const [fx, fy] = v.pt(gc);
  parts.push(`<g><line x1="${fx}" y1="${fy}" x2="${fx}" y2="${fy - 16}" stroke="var(--ink)" stroke-width="1.4"/>
    <path d="M${fx} ${fy - 16} L${fx + 10} ${fy - 12.5} L${fx} ${fy - 9} Z" fill="var(--flag)"/></g>`);

  if(shots && shots.length){
    const pl = shots.map(sh => v.pt(sh.p));
    parts.push(`<path d="M${pl.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L')}" fill="none" stroke="var(--ink)" stroke-opacity=".5" stroke-width="1.3"/>`);
    pl.forEach(([x, y], k) => parts.push(
      `<circle cx="${x}" cy="${y}" r="4.6" fill="var(--card)" stroke="var(--ink)" stroke-opacity=".6" stroke-width="1.2"/>
       <text x="${x}" y="${y + 2.6}" text-anchor="middle" font-size="6.2" font-weight="600" fill="var(--ink)">${k + 1}</text>`));
  }
  if(me){
    const [mx, my] = v.pt(me);
    parts.push(`<circle cx="${mx}" cy="${my}" r="7" fill="var(--turf)" fill-opacity=".2"/>
      <circle cx="${mx}" cy="${my}" r="3.4" fill="var(--turf)" stroke="var(--card)" stroke-width="1.4"/>`);
    parts.push(`<line x1="${mx}" y1="${my}" x2="${fx}" y2="${fy}" stroke="var(--turf)" stroke-width="1" stroke-opacity=".45" stroke-dasharray="3 4"/>`);
  }
  return `<svg class="holemap" viewBox="0 0 ${v.w.toFixed(1)} ${v.h.toFixed(1)}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Layout of hole ${h.n}">${parts.join('')}</svg>`;
}

/* ------------------------------------------------------------------- gps */
function startGPS(){
  if(watchId !== null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(
    p => {
      pos = [p.coords.longitude, p.coords.latitude];
      posAcc = p.coords.accuracy;
      posAge = Date.now();
      gpsState = p.coords.accuracy <= 12 ? 'good' : 'weak';
      render();
    },
    () => { gpsState = 'off'; render(); },
    { enableHighAccuracy:true, maximumAge:2000, timeout:20000 }
  );
}
function stopGPS(){ if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; } }

/* ------------------------------------------------------------------ shots */
const ACC_LIMIT = 12; // metres. Worse than this and a logged point is noise, not data.

function holeShots(r, i){ return (r.shots && r.shots[i]) || []; }
function setShots(r, i, list){ if(!r.shots) r.shots = {}; r.shots[i] = list; }

/**
 * A shot's distance is only known once the NEXT shot is logged, because the
 * next shot's start is this shot's end. The final shot of a hole ends at the
 * green centroid, which is the best estimate available without a pin position.
 */
function shotLegs(r, i, hole){
  const list = holeShots(r, i);
  if(!list.length) return [];
  const gc = hole.g.reduce((a, p) => [a[0] + p[0] / hole.g.length, a[1] + p[1] / hole.g.length], [0, 0]);
  return list.map((sh, k) => {
    const end = list[k + 1] ? list[k + 1].p : gc;
    return { seq:k + 1, from:sh.p, to:end, lie:sh.lie, yards:Math.round(dist(sh.p, end)), holed:!list[k + 1] };
  });
}

/** Lie comes free from the polygons already loaded for the map. */
function lieAt(hole, p){
  if(inRings([hole.g], p)) return 'green';
  for(const z of hole.hz) if(inRings([z.r], p)) return 'penalty';
  if(inRings(hole.bk, p)) return 'sand';
  if(inRings(hole.fw, p)) return 'fairway';
  return 'rough';
}
function inRings(rings, pt){
  for(const r of rings){
    let hit = false;
    for(let i = 0, j = r.length - 1; i < r.length; j = i++){
      const [xi, yi] = r[i], [xj, yj] = r[j];
      if((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) hit = !hit;
    }
    if(hit) return true;
  }
  return false;
}
const LIE_LABEL = { tee:'tee', fairway:'fairway', rough:'rough', sand:'bunker', penalty:'penalty area', green:'green' };

/* ------------------------------------------------------------- round helpers */
function course(){ return COURSES[S.round ? S.round.courseId : S.courseId]; }
function playedHoles(r){
  const c = COURSES[r.courseId];
  const out = [];
  for(const lid of r.loopIds){
    const L = c.loops.find(x => x.id === lid);
    for(const h of L.holes) out.push({ loopId:lid, loopName:L.name, hole:h });
  }
  return out;
}
function parOf(h, teeId){ return h.par[teeId] ?? Object.values(h.par)[0]; }
function ydOf(h, teeId){ return h.yd[teeId] ?? Object.values(h.yd)[0]; }
function toPar(r){
  const hs = playedHoles(r);
  let s = 0, p = 0;
  r.scores.forEach((v, i) => { if(v > 0){ s += v; p += parOf(hs[i].hole, r.teeId); } });
  return { strokes:s, par:p, rel:s-p };
}
const relText = n => n === 0 ? 'Even' : (n > 0 ? '+'+n : String(n));

/* ------------------------------------------------------------------ views */
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const v = S.round ? 'play' : S.view;
  ({ home:viewHome, loops:viewLoops, tees:viewTees, play:viewPlay, card:viewCard, history:viewHistory }[v] || viewHome)(app);
}

function bar(title, sub, showGps, action){
  const g = { good:['dot good','GPS ready'], weak:['dot weak','GPS weak'], off:['dot off','No GPS'] }[gpsState] || ['dot','Finding GPS'];
  return `<div class="bar">
    <div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ''}</div>
    <div class="barright">
      ${showGps ? `<div class="gps"><span class="${g[0]}"></span>${g[1]}</div>` : ''}
      ${action ? `<button class="endbtn">${action}</button>` : ''}
    </div>
  </div>`;
}

/* --- home --- */
function viewHome(app){
  stopGPS();
  app.appendChild(el(bar('Yardage', 'Four courses, no subscription', false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">Where are you playing?</p>
    <p class="note">Pick a course to start a round. Distances come from your phone's GPS to the green.</p>`;
  for(const id in COURSES){
    const c = COURSES[id];
    const btn = el(`<button class="pick"><span class="nm">${c.name.replace(/ (Golf Club|Golf Course|State Park Golf Course|Club)$/,'')}</span><span class="mt">${c.city.split(',')[0]}</span></button>`);
    btn.onclick = () => {
      S.courseId = id;
      S.teeId = c.defaultTeeSet;
      S.loopIds = c.defaultLoops || c.loops.map(l => l.id);
      S.view = c.loops.length > 1 ? 'loops' : 'tees';
      render();
    };
    b.appendChild(btn);
  }
  if(S.rounds.length){
    const h = el('<button class="back">See past rounds</button>');
    h.onclick = () => { S.view = 'history'; render(); };
    b.appendChild(h);
  }
  app.appendChild(b);
}

/* --- loop picker (McCabe) --- */
function viewLoops(app){
  const c = COURSES[S.courseId];
  app.appendChild(el(bar(c.name, 'Choose two nines', false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">Which nines?</p>
    <p class="note">${c.name} has three. Pick the two you're playing, in order.</p>`;
  const pairs = [];
  for(let i = 0; i < c.loops.length; i++)
    for(let j = 0; j < c.loops.length; j++)
      if(i !== j) pairs.push([c.loops[i], c.loops[j]]);
  const seen = new Set();
  for(const [a, d] of pairs){
    const key = a.id + '+' + d.id;
    if(seen.has(key)) continue;
    seen.add(key);
    const rt = c.ratings.find(r => r.teeSetId === S.teeId && r.loopIds.length === 2 &&
      r.loopIds.includes(a.id) && r.loopIds.includes(d.id));
    const btn = el(`<button class="pick"><span class="nm">${a.name} then ${d.name}</span><span class="mt">${rt ? rt.rating + ' / ' + rt.slope : ''}</span></button>`);
    btn.onclick = () => { S.loopIds = [a.id, d.id]; S.view = 'tees'; render(); };
    b.appendChild(btn);
  }
  const back = el('<button class="back">Back to courses</button>');
  back.onclick = () => { S.view = 'home'; render(); };
  b.appendChild(back);
  app.appendChild(b);
}

/* --- tee picker --- */
function viewTees(app){
  const c = COURSES[S.courseId];
  app.appendChild(el(bar(c.name, 'Choose your tees', false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">Which tees?</p><p class="note">Yardages and par follow the tee you pick.</p>`;
  const holes = () => {
    const out = [];
    for(const lid of S.loopIds) out.push(...c.loops.find(l => l.id === lid).holes);
    return out;
  };
  for(const t of c.teeSets){
    const hs = holes();
    const total = hs.reduce((n, h) => n + (h.yd[t.id] ?? 0), 0);
    const par = hs.reduce((n, h) => n + (h.par[t.id] ?? 0), 0);
    const rt = c.ratings.find(r => r.teeSetId === t.id &&
      (r.loopIds.length === 1 || S.loopIds.every(x => r.loopIds.includes(x))));
    const btn = el(`<button class="pick${t.id === S.teeId ? ' on' : ''}">
      <span class="nm">${t.name}</span>
      <span class="mt">${total.toLocaleString()} yds · par ${par}${rt ? ' · ' + rt.rating + '/' + rt.slope : ''}</span></button>`);
    btn.onclick = () => { S.teeId = t.id; render(); };
    b.appendChild(btn);
  }
  const go = el('<button class="go">Start round</button>');
  go.onclick = () => {
    const n = S.loopIds.reduce((m, lid) => m + c.loops.find(l => l.id === lid).holes.length, 0);
    S.round = { id:String(Date.now()), courseId:S.courseId, loopIds:S.loopIds.slice(), teeId:S.teeId,
                date:new Date().toISOString(), scores:new Array(n).fill(0), idx:0 };
    save(); render();
  };
  b.appendChild(go);
  const back = el('<button class="back">Back</button>');
  back.onclick = () => { S.view = c.loops.length > 1 ? 'loops' : 'home'; render(); };
  b.appendChild(back);
  app.appendChild(b);
}

/* --- playing --- */
function viewPlay(app){
  startGPS();
  const r = S.round, c = COURSES[r.courseId];
  const hs = playedHoles(r);
  const i = Math.min(r.idx, hs.length - 1);
  const { hole, loopName } = hs[i];
  const tee = c.teeSets.find(t => t.id === r.teeId);
  const multi = r.loopIds.length > 1;

  const topbar = el(bar(c.name.replace(/ (Golf Club|Golf Course|State Park Golf Course|Club)$/,''),
    `${tee.name} tees${multi ? ' · ' + loopName : ''}`, true, 'End round'));
  topbar.querySelector('.endbtn').onclick = () => { S.view = 'card'; render(); };
  app.appendChild(topbar);

  const b = el('<div class="body"></div>');
  const par = parOf(hole, r.teeId), yd = ydOf(hole, r.teeId);
  b.appendChild(el(`<div class="holehead">
      <span class="holenum">Hole ${hole.n}</span>
      <span class="holemeta">Par ${par} · ${yd} yds${hole.si ? ' · SI ' + hole.si : ''}</span>
    </div>`));

  const tog = el(`<div class="toggle">
      <button class="${S.mode !== 'map' ? 'on' : ''}">Yardage</button>
      <button class="${S.mode === 'map' ? 'on' : ''}">Hole map</button>
    </div>`);
  const [tnum, tmap] = tog.querySelectorAll('button');
  tnum.onclick = () => { S.mode = 'num'; render(); };
  tmap.onclick = () => { S.mode = 'map'; render(); };
  b.appendChild(tog);

  if(S.mode === 'map'){
    b.appendChild(el(`<div class="mapwrap">${mapSvg(hole, pos, holeShots(r, i))}</div>`));
    if(pos){
      const d = greenDistances(hole.g, pos);
      b.appendChild(el(`<div class="fb maprow">
          <div><div class="v">${d.front}</div><div class="l">front</div></div>
          <div><div class="v" style="color:var(--flag)">${d.center}</div><div class="l">middle</div></div>
          <div><div class="v">${d.back}</div><div class="l">back</div></div>
        </div>`));
    } else {
      b.appendChild(el(`<div class="nogps">Your position will appear once GPS locks on.</div>`));
    }
  } else if(pos){
    const d = greenDistances(hole.g, pos);
    const stale = Date.now() - posAge > 15000;
    b.appendChild(el(`<div class="yard">
        <div class="center${stale ? ' stale' : ''}">${d.center}</div>
        <div class="centerlab">to the middle of the green</div>
        <div class="fb">
          <div><div class="v">${d.front}</div><div class="l">front</div></div>
          <div><div class="v">${d.back}</div><div class="l">back</div></div>
        </div>
      </div>`));
  } else {
    b.appendChild(el(`<div class="nogps">${
      gpsState === 'off'
        ? 'Location is off or blocked. Turn it on for this site in your browser settings, then reopen this page. You can still keep score.'
        : 'Finding your position. This takes a few seconds outdoors, longer under trees.'
    }</div>`));
  }

  const sc = r.scores[i];
  const strokes = el(`<div class="strokes">
      <button class="step" aria-label="One fewer stroke">−</button>
      <div class="count"><div class="n">${sc || '—'}</div><div class="l">strokes</div></div>
      <button class="step" aria-label="One more stroke">+</button>
    </div>`);
  const [minus, plus] = strokes.querySelectorAll('.step');
  minus.onclick = () => { r.scores[i] = Math.max(0, (r.scores[i] || 0) - 1); save(); render(); };
  plus.onclick = () => { r.scores[i] = (r.scores[i] || 0) + 1; save(); render(); };
  b.appendChild(strokes);

  /* --- shot logging --- */
  const shots = holeShots(r, i);
  const legs = shotLegs(r, i, hole);
  const canLog = pos && posAcc <= ACC_LIMIT;
  const shotBox = el(`<div class="shots">
      <button class="logshot" ${canLog ? '' : 'disabled'}>Log shot ${shots.length + 1}</button>
      <div class="shothint">${
        !pos ? 'Waiting for GPS'
        : posAcc > ACC_LIMIT ? `GPS accurate to ${Math.round(posAcc)} m — too rough to log`
        : `Stand at your ball, then tap. Accurate to ${Math.round(posAcc)} m.`}</div>
    </div>`);
  shotBox.querySelector('.logshot').onclick = () => {
    const list = holeShots(r, i).slice();
    list.push({ p:pos.slice(), acc:Math.round(posAcc), t:Date.now(), lie:shots.length === 0 ? 'tee' : lieAt(hole, pos) });
    setShots(r, i, list);
    if(list.length > (r.scores[i] || 0)) r.scores[i] = list.length;
    save(); render();
  };
  b.appendChild(shotBox);

  if(legs.length){
    let rows = legs.map(L => `<li><span class="sq">${L.seq}</span>
      <span class="sy">${L.holed ? '~' + L.yards : L.yards} yds</span>
      <span class="sl">from the ${LIE_LABEL[L.lie] || L.lie}</span></li>`).join('');
    const list = el(`<ul class="shotlist">${rows}</ul>`);
    b.appendChild(list);
    const undo = el('<button class="back">Undo last shot</button>');
    undo.onclick = () => {
      const l = holeShots(r, i).slice(); l.pop(); setShots(r, i, l);
      if((r.scores[i] || 0) > l.length) r.scores[i] = l.length;
      save(); render();
    };
    b.appendChild(undo);
  }

  /* --- putts --- */
  const putts = (r.putts && r.putts[i]) || 0;
  const pbox = el(`<div class="putts">
      <span class="pl">Putts</span>
      <button class="pstep">−</button><span class="pv">${putts || '—'}</span><button class="pstep">+</button>
    </div>`);
  const [pm, pp] = pbox.querySelectorAll('.pstep');
  pm.onclick = () => { if(!r.putts) r.putts = {}; r.putts[i] = Math.max(0, putts - 1); save(); render(); };
  pp.onclick = () => { if(!r.putts) r.putts = {}; r.putts[i] = putts + 1; save(); render(); };
  b.appendChild(pbox);

  app.appendChild(b);

  const t = toPar(r);
  const nav = el(`<div class="nav">
      <button ${i === 0 ? 'disabled' : ''}>‹ Hole ${Math.max(1, hs[i-1]?.hole.n ?? 1)}</button>
      <div class="total"><div class="v">${t.strokes ? relText(t.rel) : '—'}</div><div class="l">thru ${r.scores.filter(x => x > 0).length}</div></div>
      <button ${i >= hs.length - 1 ? 'disabled' : ''}>Hole ${hs[i+1]?.hole.n ?? ''} ›</button>
    </div>`);
  const [prev, next] = nav.querySelectorAll('button');
  prev.onclick = () => { r.idx = i - 1; save(); render(); };
  next.onclick = () => { r.idx = i + 1; save(); render(); };
  app.appendChild(nav);
}

/* --- scorecard --- */
function viewCard(app){
  stopGPS();
  const r = S.round || S.viewRound;
  const c = COURSES[r.courseId];
  const hs = playedHoles(r);
  const t = toPar(r);
  app.appendChild(el(bar(c.name, new Date(r.date).toLocaleDateString(), false)));
  const b = el('<div class="body"></div>');
  b.innerHTML = `<p class="lede">${t.strokes || '—'} <span style="font-size:19px;font-weight:500;color:var(--muted)">${t.strokes ? relText(t.rel) : 'no scores yet'}</span></p>`;

  let rows = '';
  hs.forEach((x, i) => {
    const p = parOf(x.hole, r.teeId), s = r.scores[i];
    const cls = !s ? '' : (s < p ? 'under' : (s > p ? 'over' : ''));
    rows += `<tr><td class="h">${r.loopIds.length > 1 ? x.loopName.slice(0,1) + ' ' : ''}${x.hole.n}</td>
      <td>${p}</td><td>${ydOf(x.hole, r.teeId)}</td><td class="${cls}">${s || '·'}</td></tr>`;
  });
  b.appendChild(el(`<table><thead><tr><th style="text-align:left">Hole</th><th>Par</th><th>Yds</th><th>Score</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr class="sum"><td class="h">Total</td><td>${t.par || '—'}</td><td></td><td>${t.strokes || '—'}</td></tr></tfoot></table>`));

  if(S.round){
    const missing = [];
    r.scores.forEach((v, i) => { if(!v) missing.push(i); });

    if(missing.length){
      const names = missing.map(i => (r.loopIds.length > 1 ? hs[i].loopName.slice(0,1) + ' ' : '') + hs[i].hole.n);
      const shown = names.length > 8 ? names.slice(0,8).join(', ') + ' and ' + (names.length - 8) + ' more' : names.join(', ');
      const warn = el(`<div class="issue">No score yet on ${missing.length === 1 ? 'hole' : 'holes'} ${shown}.
        Saving now keeps the round as ${hs.length - missing.length} of ${hs.length} holes.</div>`);
      b.appendChild(warn);
      const jump = el(`<button class="go">Enter score for hole ${names[0]}</button>`);
      jump.onclick = () => { r.idx = missing[0]; S.view = 'play'; save(); render(); };
      b.appendChild(jump);
    }

    const done = el(`<button class="${missing.length ? 'pick savepart' : 'go'}">${
      missing.length ? 'Save as a ' + (hs.length - missing.length) + '-hole round' : 'Save round'}</button>`);
    done.onclick = () => {
      S.rounds.unshift({ ...r, saved:new Date().toISOString(), holesPlayed:hs.length - missing.length });
      S.round = null; S.view = 'home'; save(); render();
    };
    b.appendChild(done);

    b.appendChild(exportBlock(r));

    const resume = el('<button class="back">Keep playing</button>');
    resume.onclick = () => { S.view = 'play'; render(); };
    b.appendChild(resume);

    const del = el('<button class="back danger">Discard this round</button>');
    del.onclick = () => {
      if(del.dataset.armed){ S.round = null; S.view = 'home'; save(); render(); return; }
      del.dataset.armed = '1';
      del.textContent = 'Tap again to discard — this cannot be undone';
    };
    b.appendChild(del);
  } else {
    b.appendChild(exportBlock(r));

    const back = el('<button class="back">Back</button>');
    back.onclick = () => { S.viewRound = null; S.view = 'history'; render(); };
    b.appendChild(back);

    const del = el('<button class="back danger">Delete this round</button>');
    del.onclick = () => {
      if(del.dataset.armed){
        S.rounds = S.rounds.filter(x => x.id !== r.id);
        S.viewRound = null; S.view = 'history'; save(); render(); return;
      }
      del.dataset.armed = '1';
      del.textContent = 'Tap again to delete — this cannot be undone';
    };
    b.appendChild(del);
  }
  app.appendChild(b);
}

/* --- export --- */
function roundCsv(r){
  const c = COURSES[r.courseId], hs = playedHoles(r);
  const tee = c.teeSets.find(t => t.id === r.teeId);
  const head = ['course','loop','hole','par','stroke_index','yards','strokes','putts','shot_seq','shot_yards','shot_lie','shot_lat','shot_lon','gps_accuracy_m'];
  const rows = [head.join(',')];
  hs.forEach((x, i) => {
    const base = [c.name, x.loopName, x.hole.n, parOf(x.hole, r.teeId), x.hole.si ?? '', ydOf(x.hole, r.teeId),
                  r.scores[i] || '', (r.putts && r.putts[i]) || ''];
    const legs = shotLegs(r, i, x.hole);
    if(!legs.length){ rows.push([...base, '', '', '', '', '', ''].map(csvCell).join(',')); return; }
    legs.forEach(L => rows.push([...base, L.seq, L.yards, L.lie, L.from[1].toFixed(6), L.from[0].toFixed(6),
      holeShots(r, i)[L.seq - 1].acc].map(csvCell).join(',')));
  });
  return `# ${c.name} — ${tee.name} tees — ${new Date(r.date).toLocaleDateString()}\n` + rows.join('\n');
}
const csvCell = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);

function ghinSummary(r){
  const c = COURSES[r.courseId], hs = playedHoles(r), t = toPar(r);
  const tee = c.teeSets.find(t2 => t2.id === r.teeId);
  const rt = c.ratings.find(x => x.teeSetId === r.teeId &&
    (x.loopIds.length === 1 || r.loopIds.every(l => x.loopIds.includes(l))));
  const played = r.scores.filter(x => x > 0).length;
  const lines = [
    c.name,
    `${tee.name} tees${r.loopIds.length > 1 ? ' — ' + r.loopIds.map(l => c.loops.find(L => L.id === l).name).join(' + ') : ''}`,
    new Date(r.date).toLocaleDateString(),
    rt ? `Rating ${rt.rating} / Slope ${rt.slope}` : 'Rating unavailable',
    `Score ${t.strokes} (${relText(t.rel)})${played < hs.length ? ` over ${played} of ${hs.length} holes` : ''}`,
    '',
    hs.map((x, i) => `${x.hole.n}:${r.scores[i] || '-'}`).join('  '),
  ];
  return lines.join('\n');
}

function download(name, text, mime){
  try{
    const blob = new Blob([text], { type:mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  }catch(e){ return false; }
}

function exportBlock(r){
  const wrap = el('<div class="exports"></div>');
  const c = COURSES[r.courseId];
  const stamp = new Date(r.date).toISOString().slice(0, 10);

  const csv = el('<button class="pick"><span class="nm">Download CSV</span><span class="mt">scores, putts, shots</span></button>');
  csv.onclick = () => {
    const text = roundCsv(r);
    if(!download(`${stamp}-${c.id}.csv`, text, 'text/csv')) showText(wrap, text);
  };
  wrap.appendChild(csv);

  const gh = el('<button class="pick"><span class="nm">Summary for GHIN</span><span class="mt">copy and post</span></button>');
  gh.onclick = () => {
    const text = ghinSummary(r);
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(
        () => { gh.querySelector('.mt').textContent = 'copied'; },
        () => showText(wrap, text));
    } else showText(wrap, text);
  };
  wrap.appendChild(gh);
  return wrap;
}

function showText(wrap, text){
  let ta = wrap.querySelector('textarea');
  if(!ta){ ta = document.createElement('textarea'); ta.className = 'dump'; ta.rows = 10; wrap.appendChild(ta); }
  ta.value = text; ta.select();
}

/* --- history --- */
function viewHistory(app){
  app.appendChild(el(bar('Past rounds', '', false)));
  const b = el('<div class="body"></div>');
  if(!S.rounds.length){
    b.innerHTML = `<p class="lede">Nothing saved yet</p><p class="note">Finish a round and it'll show up here.</p>`;
  } else {
    b.innerHTML = `<p class="lede">Past rounds</p>`;
    S.rounds.forEach(r => {
      const c = COURSES[r.courseId], t = toPar(r);
      const total = playedHoles(r).length;
      const played = r.scores.filter(x => x > 0).length;
      const partial = played < total ? ` · ${played} of ${total} holes` : '';
      const btn = el(`<button class="pick"><span class="nm">${c.name.replace(/ (Golf Club|Golf Course|State Park Golf Course|Club)$/,'')}</span>
        <span class="mt">${t.strokes} · ${relText(t.rel)} · ${new Date(r.date).toLocaleDateString()}${partial}</span></button>`);
      btn.onclick = () => { S.viewRound = r; S.view = 'card'; render(); };
      b.appendChild(btn);
    });
  }
  const back = el('<button class="back">Back</button>');
  back.onclick = () => { S.view = 'home'; render(); };
  b.appendChild(back);
  app.appendChild(b);
}

/* ------------------------------------------------------------------- boot */
load();
render();
</script>
